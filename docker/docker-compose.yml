services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --topic raw-events --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      kafka-topics --create --if-not-exists --topic processed-events --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
      echo 'Kafka topics created successfully'
      "

  spark:
      image: jupyter/all-spark-notebook
      container_name: spark
      volumes:
        - ../spark:/home/jovyan/work
        - ../notebooks:/home/jovyan/notebooks
        - ../data:/home/jovyan/data
        - ../models:/home/jovyan/models
      user: root 
      ports:
      - "8888:8888"  # Jupyter Notebook
      - "4040:4040"  # Spark UI
      environment:
        - CHOWN_HOME=yes  
        - JUPYTER_ENABLE_LAB=yes
      command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8888"]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 30s
      depends_on:
        kafka:
          condition: service_healthy

  spark-submit:
    image: jupyter/all-spark-notebook
    container_name: spark-submit
    volumes:
      - ../spark:/home/jovyan/work
      - ../data:/home/jovyan/data
      - ../models:/home/jovyan/models
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark:
        condition: service_healthy
    command: >
      spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 /home/jovyan/work/spark_streaming.py

  bridge:
      build: ../bridge_app
      container_name: bridge_app
      environment:
        - PYTHONUNBUFFERED=1
      ports:
        - "5005:5005"
      depends_on:
        kafka:
          condition: service_healthy
